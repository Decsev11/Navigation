<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카카오내비 실행</title>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.3/kakao.min.js"
        crossorigin="anonymous"></script>
</head>

<body style="font-family:sans-serif;padding:20px">

<h2>카카오내비 실행</h2>
<p id="route">경로 준비 중...</p>
<p id="status">SDK 확인 중...</p>

<button id="go"
 style="width:100%;padding:22px;font-size:22px;font-weight:bold">
🚗 카카오내비 열기
</button>

<script>
const statusEl = document.getElementById("status");

try {
  if (typeof Kakao === "undefined") {
    throw new Error("Kakao SDK 로딩 실패");
  }

  if (!Kakao.isInitialized()) {
    Kakao.init("3511572c1f10c8bcd3f4b71dce36c296");
  }

  statusEl.textContent =
    Kakao.isInitialized()
      ? "✅ Kakao SDK 초기화 성공"
      : "❌ Kakao SDK 초기화 실패";

} catch (e) {
  statusEl.textContent = "❌ " + e.message;
}

const p = new URLSearchParams(location.search);

const destination = {
  name: p.get("destName") || "홍대입구역",
  x: Number(p.get("destX") || 126.9240),
  y: Number(p.get("destY") || 37.5572),
  coordType: "wgs84"
};

const viaName = p.get("viaName");
const viaX = p.get("viaX");
const viaY = p.get("viaY");

const viaList = [];

if (viaName && viaX && viaY) {
  viaList.push({
    name: viaName,
    x: Number(viaX),
    y: Number(viaY)
  });
}

document.getElementById("route").textContent =
  (viaList.length ? viaName + " 경유 → " : "") +
  destination.name;

document.getElementById("go").addEventListener("click", function () {

  try {

    statusEl.textContent = "카카오내비 실행 요청 중...";

    Kakao.Navi.start({
      name: destination.name,
      x: destination.x,
      y: destination.y,
      coordType: "wgs84",
      viaPoints: viaList
    });

    setTimeout(function () {
      statusEl.textContent =
        "실행 요청 완료 — 앱이 열리지 않았다면 이 문구를 알려주세요.";
    }, 1500);

  } catch (e) {

    statusEl.textContent =
      "❌ 실행 오류: " + e.message;

  }
});
</script>

</body>
</html>
